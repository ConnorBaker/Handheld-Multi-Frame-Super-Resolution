# Conda/micromamba environment for the handheld pipeline.
#
# Tested stack (NVIDIA GB10 / Grace Blackwell, sm_121, CUDA 13.2):
#   python 3.12, pytorch 2.11, cupy 14.1, numba 0.65.
# The previous python=3.9 / pytorch=1.13 / pytorch-cuda=11.6 pins do NOT run on
# Blackwell GPUs. CuPy is now a hard dependency: numba's CUDA target cannot JIT
# on this hardware (ptxas rejects the PTX version numba emits), so the GPU
# routines run through CuPy / torch instead.
#
# Create with:  micromamba create -f environment.yaml
name: handheld
channels:
  - conda-forge
  - pytorch
  - nvidia
dependencies:
  - python=3.12
  - pytorch
  - numba
  - cupy
  - cuda-nvcc
  - cuda-nvrtc
  - pip
  - pip:
      - -r requirements.txt
