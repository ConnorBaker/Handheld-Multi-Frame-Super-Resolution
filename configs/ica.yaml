scale: 2
mode: bayer
debug: false
verbose: 0
grey_method: FFT
noise_model:
  alpha:
  beta:

# block_matching:
#   tuning:
#     factors: [1, 2, 2]
#     tile_size: 16
#     tile_size_factors: [1, 0.5, 0.5]
#     search_radii: [1, 16, 32]
#     metrics: [L1, L2, L2]
#     flow_upscale_mode: bicubic  # options: nearest, bilinear, bicubic
# block_matching:
#   tuning:
#     factors: [1, 2, 2, 2]      # Add another level
#     tile_size: 32              # Start larger
#     tile_size_factors: [1, 1, 0.5, 0.5]  # Keep 32→32→16→16
#     search_radii: [1, 4, 8, 16]  # Reduce search (you likely have small motion)
#     metrics: [L1, L1, L2, L2]    # L1 at coarse levels reduces blocky artifacts
#     flow_upscale_mode: bicubic
# block_matching:
#   tuning:
#     factors: [1, 2, 4, 4]           # More pyramid levels
#     tile_size: 32                    # Or keep SNR_based
#     tile_size_factors: [1, 0.5, 0.5, 0.5]  # 32→16→16→16
#     search_radii: [1, 2, 4, 4]       # Much smaller!
#     metrics: [L1, L1, L2, L2]
#     flow_upscale_mode: bicubic

block_matching:
  tuning:
    # factors: [1, 2, 4, 4]           # More pyramid levels
    # tile_size: 16                    # Or keep SNR_based
    # tile_size_factors: [1, 1, 1, 0.5]  # 32→16→16→16
    # search_radii: [1, 2, 2, 4]       # Much smaller!
    # metrics: [L1, L2, L2, L2]
    # flow_upscale_mode: nearest


    # factors: [1, 2, 4, 4]
    # tile_size: 64
    # tile_size_factors: [1, 1, 0.5, 0.5]
    # search_radii: [1, 2, 4, 4]
    # metrics: [L1, L2, L2, L2]
    # flow_upscale_mode: nearest

    factors: [1, 2, 4, 4]
    tile_size: 64
    tile_size_factors: [1, 1, 0.5, 0.5]
    search_radii: [1, 2, 4, 4]
    metrics: [L1, L2, L2, L2]
    flow_upscale_mode: nearest

ica:
  tuning:
    n_iter: 3
    sigma_blur: 0

# robustness:
#   enabled: true
#   save_mask: true
#   tuning:
#     t: 0.12
#     s1: 2
#     s2: 12
#     Mt: 0.8

robustness:
  enabled: true
  save_mask: true
  tuning:
    t: 0.12    # Back to moderate now that flow is accurate
    s1: 1.5
    s2: 10
    Mt: 1.0

merging:
  kernel: steerable
  selection_law: linear # options: hard_threshold, linear
  tuning:
    k_detail: SNR_based
    k_denoise: SNR_based
    D_th: SNR_based
    D_tr: SNR_based
    k_stretch: 4
    k_shrink: 2

postprocessing:
  enabled: true
  do_color_correction: true
  do_gamma_correction: true
  do_tonemapping: false
  sharpening:
    enabled: false
    amount: 1.5
    radius: 3
  do_devignetting: false

accumulated_robustness_denoiser: 
  enabled: true
  median:
    enabled: false
    radius_max: 3
    max_frame_count: 8
  gauss:
    enabled: false
    sigma_max: 1.5
    max_frame_count: 8
  merge:
    enabled: true
    rad_max: 2
    max_multiplier: 8 # Multiplier of the covariance for single frame SR
    max_frame_count: 2 # number of merged frames above which no blur is applied