scale: 1
debug: false
verbose: 1
grey_method: FFT
noise_model:
  alpha: 
  beta:

block_matching:
  tuning:
    # Defined fine-to-coarse
    factors: [1, 2, 4, 4]
    tile_size: "SNR_based"
    tile_size_factors: [1, 1, 1, 0.5]
    search_radii: [1, 4, 4, 4]
    metrics: ['L1', 'L2', 'L2', 'L2']
    flow_upscale_mode: nearest  # options: nearest, bilinear, bicubic
ica:
  tuning:
    n_iter: 3
    sigma_blur: 0

robustness:
  enabled: true
  save_mask: true
  tuning:
    t: 0.12
    s1: 2
    s2: 12
    Mt: 0.8

merging:
  kernel: steerable
  selection_law: linear # options: hard_threshold, linear
  tuning:
    k_detail: SNR_based
    k_denoise: SNR_based
    D_th: SNR_based
    D_tr: SNR_based
    k_stretch: 4
    k_shrink: 2

postprocessing:
  enabled: true
  do_color_correction: False
  do_gamma_correction: true
  do_tonemapping: false
  sharpening:
    enabled: true
    amount: 1.5
    radius: 3
  deblur:                 # Polyblur blind deblur (vendored); ON by default, replaces sharpening
    enabled: true
    n_iter: 1
    alpha: 3              # mid-frequency deconvolution strength (tuned: synthetic-GT + Canon)
    beta: 3               # high-frequency deconvolution strength (tuned)
    remove_halo: true     # suppress deblur halos at strong edges
    prefiltering: true    # base/detail split to limit noise amplification
    edgetaping: true
  aberration:             # Stage B: per-tile (spatially-varying) deblur + learned defringe (vendored)
    enabled: false        # OFF by default; takes precedence over deblur/sharpening when on
    model_type: super_tiny
    patch_size: 400
    overlap: 0.25
    batch_size: 20
    ker_size: 31
    alpha: 3              # per-tile deconvolution strength (mid)
    beta: 3               # per-tile deconvolution strength (high)
    c: 0.416              # Polyblur blur-model slope
    sigma_b: 0.358        # Polyblur blur-model intercept
    do_deblur: true
    do_defringe: true
  do_devignetting: false

accumulated_robustness_denoiser: 
  median:
    enabled: False
    radius_max: 3
    max_frame_count: 8
  gauss:
    enabled: False
    sigma_max: 1.5
    max_frame_count: 8
  merge:
    enabled: False
    rad_max: 2
    max_multiplier: 8 # Multiplier of the covariance for single frame SR
    max_frame_count: 2 # # number of merged frames above which no blur is applied