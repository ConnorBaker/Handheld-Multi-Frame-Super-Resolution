scale: 1
debug: false
verbose: 1
grey_method: FFT
noise_model:
  alpha: 
  beta:

block_matching:
  tuning:
    # Defined fine-to-coarse
    factors: [1, 2, 4, 4]
    tile_size: "SNR_based"
    tile_size_factors: [1, 1, 1, 0.5]
    search_radii: [1, 4, 4, 4]
    metrics: ['L1', 'L2', 'L2', 'L2']
    flow_upscale_mode: nearest  # options: nearest, bilinear, bicubic
ica:
  tuning:
    n_iter: 3
    sigma_blur: 0

robustness:
  enabled: true
  save_mask: true
  tuning:
    t: 0.12
    s1: 2
    s2: 12
    Mt: 0.8

merging:
  kernel: steerable
  selection_law: linear # options: hard_threshold, linear
  expose_edge_strength: false  # when true, main() returns the structure-tensor
                               #   large-eigenvalue (l1) edge-strength field in
                               #   debug_dict['edge_strength'] at OUTPUT resolution.
                               #   It is the gate the measured_rl deconv path uses
                               #   (postprocessing.aberration.deblur_method). Default
                               #   off -> main()'s return is unchanged.
  tuning:
    k_detail: SNR_based
    k_denoise: SNR_based
    D_th: SNR_based
    D_tr: SNR_based
    k_stretch: 4
    k_shrink: 2

postprocessing:
  enabled: true
  do_color_correction: False
  do_gamma_correction: true
  do_tonemapping: false
  sharpening:
    enabled: true
    amount: 1.5
    radius: 3
  deblur:                 # Polyblur blind deblur (vendored); ON by default, replaces sharpening
    enabled: true
    n_iter: 1
    c: 0.352             # blur-model slope   (sigma^2 = c^2/grad^2 - sigma_b^2, clamped)
    sigma_b: 0.45        # blur-model intercept. Polyblur's 0.768 default estimated ~0 blur on our
                         #   (already fairly sharp) merge -> inert; ~0.45 makes it engage (confirmed
                         #   by the DxO per-burst sweep, db_sigma_b=0.448, AND by hand). M scales
                         #   with image size, so this is CONTENT/SCALE-DEPENDENT -- calibrate per
                         #   camera/scale (eval.sweep_synthetic --dxo-ref) for best results.
    alpha: 3              # mid-frequency deconvolution strength
    beta: 3              # high-frequency deconvolution strength
    remove_halo: true     # suppress deblur halos at strong edges
    prefiltering: SNR_based  # noise-safety base/detail split: ON when noisy (else the deblur
                         #   amplifies noise -> PSNR drops), OFF once clean enough to deblur
                         #   aggressively. Nearly nulls the deblur when ON, so it MUST be off for
                         #   clean low-ISO merges to sharpen. Resolved from SNR in params.py.
    edgetaping: true
  aberration:             # Stage B: per-tile (spatially-varying) deblur + learned defringe (vendored); DEFAULT
    enabled: true         # the default sharpening path; takes precedence over deblur/sharpening
    model_type: super_tiny
    patch_size: 400
    overlap: 0.25
    batch_size: 20
    ker_size: 31
    alpha: 3              # per-tile deconvolution strength (mid)
    beta: 3               # per-tile deconvolution strength (high)
    c: 0.416              # Polyblur blur-model slope
    sigma_b: 0.358        # Polyblur blur-model intercept
    do_deblur: true
    do_defringe: true
    deblur_method: polyblur  # which deblur the Stage-B 'do_deblur' runs. DEFAULT
                         #   'polyblur' = the shipped per-tile blind/bounded Polyblur
                         #   (behavior unchanged). 'measured_rl' = opt-in measured-PSF
                         #   Richardson-Lucy deconvolution gated by the merge's
                         #   structure-tensor edge field; the learned defringe still
                         #   runs after it. measured_rl needs the gate -> also set
                         #   merging.expose_edge_strength: true. The keys below apply
                         #   ONLY to measured_rl:
    # sigma: 1.1         # deconv Gaussian sigma -- PER-CAMERA/SCALE calibration (like
                         #   sigma_b), NOT a blind per-tile estimate. ~1.08 *
                         #   partial_gaussian_sigma(merge_sigma, target).
    # iters: 3           # RL iterations (more => sharper but more noise/ringing; 3-5)
    # method: rl         # 'rl' (preferred, less halo/noise) or 'wiener'
    # nsr: 0.01          # Wiener noise-to-signal regularization (method: wiener only)
    # gate_lo_pct: 50    # smoothstep low percentile of sqrt(l1) (gate ~0 below)
    # gate_hi_pct: 90    # smoothstep high percentile of sqrt(l1) (gate ~1 above)
    # bilateral: false   # optional edge-preserving bilateral to strip deconv noise
    # bilateral_sigma_color:   # bilateral sigmaColor; auto ~3x flat-noise if unset
  do_devignetting: false

accumulated_robustness_denoiser: 
  median:
    enabled: False
    radius_max: 3
    max_frame_count: 8
  gauss:
    enabled: False
    sigma_max: 1.5
    max_frame_count: 8
  merge:
    enabled: False
    rad_max: 2
    max_multiplier: 8 # Multiplier of the covariance for single frame SR
    max_frame_count: 2 # # number of merged frames above which no blur is applied